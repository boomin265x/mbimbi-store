<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Checkout | MBIMBI's FASHION STORE</title>
	<meta name="description" content="Complete your MBIMBI's FASHION STORE order." />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<header>
		<nav class="nav" aria-label="Checkout navigation">
			<a class="brand" href="index.html">MBIMBI's FASHION STORE<span>.</span></a>
			<a class="text-link" href="shop.html">Back to shop</a>
		</nav>
	</header>

	<main class="checkout-page">
		<section class="checkout-intro">
			<div class="eyebrow">Almost yours / 02</div>
			<h1>Complete your order.</h1>
			<p>Tell us where to send your pieces and we will take care of the rest.</p>
		</section>
		<div class="checkout-layout">
			<form class="checkout-form" id="checkoutForm">
				<h2>Delivery details</h2>
				<label>Full name<input name="name" type="text" autocomplete="name" required /></label>
				<label>Email address<input name="email" type="email" autocomplete="email" required /></label>
				<label>Delivery address<textarea name="address" rows="4" autocomplete="street-address" required></textarea></label>
				<button class="primary-button" type="submit">Place order&nbsp; ↗</button>
			</form>
			<aside class="order-summary" aria-labelledby="summaryTitle">
				<h2 id="summaryTitle">Your order</h2>
				<div id="orderItems"></div>
				<div class="total-line"><span>Total</span><span id="orderTotal">MWK 0</span></div>
				<a class="text-link" href="shop.html">Continue shopping</a>
			</aside>
		</div>
	</main>
	<script src="checkout.js"></script>
</body>
</html>
